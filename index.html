<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Tech - Cadastro de Cliente</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            color: #333;
        }
        .form-card { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
            width: 100%;
            max-width: 400px;
        }
        h2 { color: #1e3c72; margin-bottom: 10px; text-align: center; }
        p { text-align: center; font-size: 0.9rem; color: #666; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; }
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1.5px solid #ddd; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px;
        }
        input:focus { border-color: #1e3c72; outline: none; }
        button { 
            background-color: #1e3c72; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 1rem;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover { background-color: #2a5298; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Seja um Parceiro</h2>
        <p>Preencha os dados para receber nosso contato comercial.</p>
        
        <form action="#" method="post">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Alex Teixeira" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail Corporativo</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="interesse">Área de Interesse</label>
                <select id="interesse" name="interesse">
                    <option value="devops">DevOps & Cloud</option>
                    <option value="software">Desenvolvimento de Software</option>
                    <option value="infra">Infraestrutura TI</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mensagem">Como podemos ajudar?</label>
                <textarea id="mensagem" name="mensagem" rows="3" placeholder="Conte brevemente seu desafio..."></textarea>
            </div>

            <button type="submit">Solicitar Demonstração</button>
        </form>
    </div>
</body>
</html>
